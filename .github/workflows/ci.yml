# CI: lint, type check, tests, and evals on every push.
#
# Runs the DETERMINISTIC eval suite only (make evals without --llm).
# The LLM-dependent evals require ANTHROPIC_API_KEY and cost ~$0.50
# per run. They are run manually before releases, not on every push.
# This is a stated budget choice, not an oversight.
#
# The backend job matrixes over two largely-orthogonal axes:
#   - CUSTOS_VECTOR_BACKEND (qdrant, pgvector) -- ADR-001
#   - CUSTOS_AGENT_RUNTIME (native, langgraph) -- ADR (docs/decisions/006-agent-runtime.md)
#
# This is an explicit `matrix.include` of 3 legs, not a full 2x2 (4-leg)
# cross product: {qdrant, native}, {pgvector, native}, {qdrant, langgraph}.
# Reasoning: agent_runtime only changes tool-call orchestration/gating; it
# does not touch the retrieval/access-control path (both runtimes call the
# same CustosRetriever for corpus-touching tools). vector_backend only
# changes which store answers that retrieval call. The interaction surface
# between the two axes is thin, so a full 2x2 would spend real CI minutes
# re-proving the retrieval-layer behavior twice for no new coverage. 3 legs
# prove every individual axis value at least once: native (the default,
# where a regression is costliest) on both backends, and langgraph on the
# primary backend (Qdrant, per ADR-001). The one combination this leaves
# untested is {pgvector, langgraph} -- stated here explicitly, not silently
# accepted; nothing about pgvector access control depends on which agent
# runtime is selected, but if that assumption ever stops holding, this is
# the gap that would hide a regression.
#
# The same 61-case eval suite and the same pytest suite run on every leg.
# An eval that passes on one leg and fails on another is a finding to
# report (see the ADR), never a test to loosen.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy --strict)
        run: mypy src/ corpus/ evals/ scripts/

  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - vector_backend: qdrant
            agent_runtime: native
          - vector_backend: pgvector
            agent_runtime: native
          - vector_backend: qdrant
            agent_runtime: langgraph
    services:
      qdrant:
        image: qdrant/qdrant:v1.18.0
        ports:
          - 6333:6333
      postgres:
        image: pgvector/pgvector:pg17
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: custos
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CUSTOS_VECTOR_BACKEND: ${{ matrix.vector_backend }}
      CUSTOS_AGENT_RUNTIME: ${{ matrix.agent_runtime }}
      QDRANT_URL: http://localhost:6333
      CUSTOS_PGVECTOR_DSN: postgresql://postgres:localdev@localhost:5432/custos
      # Same DSN, used by tests/test_vector_store_pgvector.py directly.
      # The postgres service runs on every matrix leg (harmless when the
      # leg under test is qdrant) so those tests exercise the pgvector ACL
      # path on both legs, not just the pgvector leg.
      CUSTOS_PGVECTOR_TEST_DSN: postgresql://postgres:localdev@localhost:5432/custos

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Apply pgvector migration
        run: python scripts/migrate_pgvector.py

      - name: Index corpus (${{ matrix.vector_backend }})
        run: python -m custos.ingest

      # tests/test_stream_concurrency.py (two concurrent /api/chat/stream
      # requests must progress concurrently, not serialize behind a
      # blocked event loop) self-skips on every leg except qdrant/native
      # via a pytest.mark.skipif inside the test -- it mocks out the LLM,
      # retriever, and tool registry entirely, so CUSTOS_VECTOR_BACKEND /
      # CUSTOS_AGENT_RUNTIME cannot change its outcome, and it is
      # timing-sensitive (sleep-based), so running it 3x would only add
      # flake risk for zero extra coverage. Expect 1 fewer collected test
      # on the pgvector and langgraph legs than on qdrant/native.
      - name: Run tests
        run: pytest tests/ -q

      - name: Run evals (deterministic, no LLM) against ${{ matrix.vector_backend }} / ${{ matrix.agent_runtime }}
        run: python -m evals.harness

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Type check (tsc)
        run: npx tsc --noEmit

      - name: Run tests (vitest)
        run: npx vitest run

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: https://api.example.com

  # custos.andrewbolaji.com is a Cloudflare Pages project that was created with
  # Direct Upload rather than Git integration, so a git push does not by itself
  # reach Cloudflare. Cloudflare does not allow converting an existing project
  # to Git integration after the fact. This job replaces that missing Git
  # integration by running wrangler pages deploy, which is itself a Direct
  # Upload, against the same project once the test jobs above have passed.
  deploy:
    needs: [lint, backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: custos-deploy
      cancel-in-progress: true
    defaults:
      run:
        working-directory: ui

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: https://api.custos.andrewbolaji.com

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=custos --branch=main
          workingDirectory: ui
