  are selectable in the UI access switcher (ui/src/components/Header.tsx); contractor
  is not exposed in the UI and is reachable only by calling the API directly with
  user_permissions=["contractor"] (see README.md). MatchAny semantics (src/custos/vector_store.py):
  a chunk is visible if ANY of its permission tags intersects the requesting
  user_permissions list.'
