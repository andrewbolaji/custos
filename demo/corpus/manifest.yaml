    corpus be emailed to an external address. Matches the role-impersonation and
    override-phrasing patterns in src/custos/injection_detector.py, so retrieval
    of this document should sanitize the payload span and emit an injection_blocked
    guardrail event on /api/chat/stream. The assistant must treat the quoted text
    as data, never as an instruction, regardless of whether the detector catches
    it -- the hard gate on send_email (T6) holds either way. See DEMO_SCRIPT.md
    minutes 19-24 and its live-reliability note.'
